<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js","three/addons/":"./jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
const W=1080,H=1920;const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color('#2b2f3a');
const cam=new THREE.PerspectiveCamera(35,W/H,0.05,50);
const env=await new RGBELoader().loadAsync('studio.hdr');env.mapping=THREE.EquirectangularReflectionMapping;s.environment=env;
const L=new THREE.DirectionalLight('#fff',2.2);L.position.set(1.5,3,1.2);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.camera.left=-1;L.shadow.camera.right=1;L.shadow.camera.top=1;L.shadow.camera.bottom=-1;s.add(L);
const gl=new GLTFLoader();const t=(await gl.loadAsync('WoodenTable_01/WoodenTable_01.gltf')).scene;t.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});s.add(t);
const box=new THREE.Box3().setFromObject(t);const top=box.max.y;
const b=(await gl.loadAsync('bananas/bananas.gltf')).scene;b.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});b.position.set(0,top,0);b.scale.setScalar(1.6);s.add(b);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#3a3530',roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;s.add(fl);
window.render=(tt)=>{const a=0.4+tt*0.3;cam.position.set(Math.sin(a)*0.75,top+0.42,Math.cos(a)*0.75);cam.lookAt(0,top+0.05,0);r.render(s,cam)};
window.ready=true;
</script></body></html>
