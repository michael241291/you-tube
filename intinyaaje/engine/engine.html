<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box;font-family:'Poppins',sans-serif}
#root,#faces{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#faces{pointer-events:none}
.stroke{text-shadow:0 0 2px #000,4px 4px 0 #000,-4px 4px 0 #000,4px -4px 0 #000,-4px -4px 0 #000,0 6px 0 #000,0 -6px 0 #000,6px 0 0 #000,-6px 0 0 #000,0 10px 24px rgba(0,0,0,.6)}
</style></head><body><div id="maplayer" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden"></div><div id="root"></div><div id="faces"></div>
<script>
const EP=/*EP*/;
const ASSET=EP.asset||'../../assets/';
const ST=EP.style||{};
const THEMES={kuning:{a:'#ffd23f',e:'#ff3b5c',bg:'#0b1226',bg2:'#22305a',b2:'#3aa0ff'},hijau:{a:'#3ddc84',e:'#ff5c8a',bg:'#07160f',bg2:'#124a33',b2:'#2ee6d6'},oranye:{a:'#ff9f1c',e:'#2ec4ff',bg:'#1a0d05',bg2:'#5a2a0e',b2:'#ffd23f'},cyan:{a:'#2ee6d6',e:'#ffd23f',bg:'#041a1f',bg2:'#0e4652',b2:'#7b61ff'},pink:{a:'#ff5c8a',e:'#ffd23f',bg:'#1a0614',bg2:'#5a1240',b2:'#ff9f1c'},ungu:{a:'#b18cff',e:'#3ddc84',bg:'#0f0820',bg2:'#33215f',b2:'#ff5c8a'}};
const TH=THEMES[ST.theme||'kuning']||THEMES.kuning;
const W=1080,H=1920,Y=TH.a,EC=TH.e;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
function hl(s,col){return String(s).replace(/\*([^*]+)\*/g,`<span style="color:${col||Y}">$1</span>`)}
function keyAt(keys,lt){ // keys: [[t, ...vals]] -> interpolated vals (eased)
  if(lt<=keys[0][0])return keys[0].slice(1);
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(lt<=b[0]){const k=io(prog(lt,a[0],b[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],k))}}
  return keys[keys.length-1].slice(1)}

/* ---------- preload images ---------- */
const IMG={};
const imgList=[];EP.scenes.forEach(s=>{if(s.type==='photo')imgList.push(s.src)});
window.assetsReady=Promise.all(imgList.map(src=>new Promise(res=>{const im=new Image();im.onload=()=>{IMG[src]={w:im.naturalWidth,h:im.naturalHeight};im.decode().then(res,res)};im.onerror=res;im.src=src;})));

/* ---------- scenes ---------- */
let MAPCUR=null;
function mapScene(s,lt,idx){
  const [cx,cy,w]=keyAt(s.cam,lt);const h=w*H/W;
  const vx=cx-w/2,vy=cy-h/2;
  const toS=(x,y)=>[(x-vx)/w*W,(y-vy)/h*H];
  let css='';
  (s.hl||[]).forEach(o=>{const p=prog(lt,o.t,o.t+0.5);if(p<=0)return;
    const blink=o.blink?(0.65+0.35*Math.sin(lt*7)):1;
    css+=`${o.sel}{fill:${o.color||Y};fill-opacity:${(0.25+0.75*p)*blink};stroke:#fff;stroke-width:${w/400}}`});
  const ml=document.getElementById('maplayer');
  if(MAPCUR!==idx){ml.innerHTML=`<svg id="msvg" width="${W}" height="${H}" style="position:absolute;left:0;top:0"><style id="mcss"></style><rect id="msea" fill="${s.sea||'#0d1d33'}"/>${s.svg}</svg>`;MAPCUR=idx;}
  ml.style.display='block';
  const sv=document.getElementById('msvg');sv.setAttribute('viewBox',`${vx} ${vy} ${w} ${h}`);
  const sea=document.getElementById('msea');sea.setAttribute('x',vx);sea.setAttribute('y',vy);sea.setAttribute('width',w);sea.setAttribute('height',h);
  document.getElementById('mcss').textContent=`.land{stroke-width:${w/900}px}`+css;
  let svg='';
  let ov='';
  (s.rings||[]).forEach(o=>{const p=prog(lt,o.t,o.t+0.6);if(p<=0||(o.t1&&lt>o.t1))return;const [x,y]=toS(o.x,o.y);const r=(o.r||70)*(1+0.12*Math.sin(lt*6));
    ov+=`<div style="position:absolute;left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:9px solid ${o.color||'#ff3b30'};box-shadow:0 0 30px rgba(255,59,48,.6);opacity:${eo(p)};transform:scale(${0.4+0.6*eb(p)})"></div>`});
  (s.arrows||[]).forEach(o=>{ov+=arrowHTML(o,lt,toS)});
  (s.labels||[]).forEach(o=>{const p=prog(lt,o.t,o.t+0.4);if(p<=0||(o.t1&&lt>o.t1))return;const [x,y]=toS(o.x,o.y);
    if(o.pill){ov+=calloutHTML(o,x,y,p);return}
    ov+=`<div class="stroke" style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,calc(-50% + ${Math.sin(lt*2.2+o.x)*6}px)) scale(${0.3+0.7*eb(p)}) rotate(${(1-eo(p))*-10}deg);opacity:${clamp(p*2)};color:${o.color||'#fff'};font-weight:800;font-size:${o.size||48}px;white-space:nowrap;letter-spacing:1px">${hl(o.text)}</div>`});
  return svg+ov}
function arrowHTML(o,lt,toS){const p=prog(lt,o.t,o.t+0.5);if(p<=0||(o.t1&&lt>o.t1))return '';
  const [x1,y1]=toS(o.x,o.y);const ang=(o.ang??-135)*Math.PI/180;const len=o.len||200;
  const bob=Math.sin(lt*8)*10*p;
  const x0=x1+Math.cos(ang)*(len+bob),y0=y1+Math.sin(ang)*(len+bob);
  const ex=x1+Math.cos(ang)*(28+bob),ey=y1+Math.sin(ang)*(28+bob);
  const k=eo(p);const sx=lerp(x0,ex,0),sy=lerp(y0,ey,0);const tx=lerp(x0,ex,k),ty=lerp(y0,ey,k);
  const a=Math.atan2(ey-y0,ex-x0);const hx=tx,hy=ty;const s=46;
  const p1=[hx-Math.cos(a-0.5)*s,hy-Math.sin(a-0.5)*s],p2=[hx-Math.cos(a+0.5)*s,hy-Math.sin(a+0.5)*s];
  return `<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0"><g stroke="#000" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="#000"><line x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}"/><polygon points="${hx},${hy} ${p1} ${p2}"/></g><g stroke="${o.color||'#ff2d2d'}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="${o.color||'#ff2d2d'}"><line x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}"/><polygon points="${hx},${hy} ${p1} ${p2}"/></g></svg>`}
function photoScene(s,lt){
  const im=IMG[s.src]||{w:1080,h:1920};
  const [cx,cy,sc]=keyAt(s.kb||[[0,.5,.5,1]],lt);
  const base=(s.fit==='contain'?Math.min(W/im.w,H/im.h):Math.max(W/im.w,H/im.h)*1.05)*sc;const iw=im.w*base,ih=im.h*base;
  const left=W/2-cx*iw,top=H/2-cy*ih;
  const toS=(x,y)=>[left+x*iw,top+y*ih];
  let ov='';
  (s.rings||[]).forEach(o=>{const p=prog(lt,o.t,o.t+0.6);if(p<=0||(o.t1&&lt>o.t1))return;const [x,y]=toS(o.x,o.y);const r=(o.r||90)*(1+0.1*Math.sin(lt*6));
    ov+=`<div style="position:absolute;left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:10px solid ${o.color||'#ff3b30'};opacity:${eo(p)};transform:scale(${0.4+0.6*eb(p)})"></div>`});
  (s.arrows||[]).forEach(o=>{ov+=arrowHTML(o,lt,toS)});
  (s.labels||[]).forEach(o=>{const p=prog(lt,o.t,o.t+0.4);if(p<=0||(o.t1&&lt>o.t1))return;const [x,y]=toS(o.x,o.y);
    if(o.pill){ov+=calloutHTML(o,x,y,p);return}
    ov+=`<div class="stroke" style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,calc(-50% + ${Math.sin(lt*2.2+o.x*9)*6}px)) scale(${0.3+0.7*eb(p)}) rotate(${(1-eo(p))*-10}deg);opacity:${clamp(p*2)};color:${o.color||'#fff'};font-weight:800;font-size:${o.size||52}px;white-space:nowrap">${hl(o.text)}</div>`});
  const dim=s.dim??0.12;
  const blurBg=s.bg?`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,${s.bg2||'#22305a'} 0%,${s.bg} 75%)"></div>`:s.fit==='contain'?`<img src="${s.src}" style="position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;filter:blur(40px) brightness(.45)">`:'';
  return blurBg+`<img src="${s.src}" style="position:absolute;left:${left}px;top:${top}px;width:${iw}px;height:${ih}px"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,${dim+0.25}) 0%,rgba(0,0,0,${dim}) 30%,rgba(0,0,0,${dim}) 60%,rgba(0,0,0,${dim+0.3}) 100%)"></div>`+ov}
function cardScene(s,lt){
  const p=eb(prog(lt,0,0.45));
  const lines=(s.lines||[]).map((ln,i)=>{const o=typeof ln==='string'?{text:ln,t:0.15+i*0.3}:ln;const a=prog(lt,o.t,o.t+0.45);const q=eb(a);
    return `<div class="stroke" style="font-size:${o.size||s.size||96}px;font-weight:800;line-height:1.08;color:#fff;opacity:${clamp(a*2.5)};transform:translateX(${(1-q)*-120}px) skewX(${(1-q)*-12}deg);filter:blur(${(1-clamp(a*2))*10}px)">${hl(o.text)}</div>`}).join('');
  const b1=`left:${-200+Math.sin(lt*0.7)*120}px;top:${200+Math.cos(lt*0.5)*140}px`,b2=`left:${520+Math.cos(lt*0.6)*140}px;top:${1100+Math.sin(lt*0.8)*120}px`;
  const tagX=(1-eb(prog(lt,0,0.4)))*-300;
  return `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,${s.bg2||TH.bg2} 0%,${s.bg||TH.bg} 75%)"></div>
  <div style="position:absolute;${b1};width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,${Y}33 0%,transparent 65%)"></div>
  <div style="position:absolute;${b2};width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,${TH.b2}33 0%,transparent 65%)"></div>
  <div style="position:absolute;left:70px;top:${(s.y||420)+(EP.hud?130:0)}px;transform:scale(${(0.92+0.08*p)*(1+lt*0.008)});transform-origin:0 0;opacity:${clamp(p*2)}"><div style="display:inline-block;padding:12px 30px;border-radius:40px;background:${Y};color:#1b1b1b;font-weight:800;font-size:40px;letter-spacing:4px;margin-bottom:34px;transform:translateX(${tagX}px)">${s.tag||'INTINYA'}</div>${lines}</div>`}
function headHTML(h,lt){const t0=h.t||0;if(lt<t0||(h.t1&&lt>h.t1))return '';
  const out=(h.t1?eo(prog(lt,h.t1-0.25,h.t1)):0);
  let wi=0;const words=String(h.text).replace(/\*([^*]+)\*/g,(m,x)=>x.split(' ').map(z=>'*'+z+'*').join(' ')).split(/(<br>|\s+)/).map(tok=>{if(tok==='<br>')return '<br>';if(!tok.trim())return ' ';
    const q=eb(prog(lt,t0+wi*0.07,t0+wi*0.07+0.35));wi++;
    return `<span style="display:inline-block;transform:translateY(${(1-q)*-60}px) scale(${0.4+0.6*q}) rotate(${(1-q)*(wi%2?-12:12)}deg);opacity:${clamp(q*2)}">${hl(tok)}</span>`}).join('');
  return `<div class="stroke" style="position:absolute;left:0;top:${(h.y||250)+(EP.hud?190:0)}px;width:1080px;padding:0 60px;text-align:center;font-size:${(h.size||92)*(EP.hud?0.8:1)}px;font-weight:800;line-height:1.05;color:#fff;opacity:${1-out};transform:translateY(${-out*40}px)">${words}</div>`}
function stampHTML(st,lt){const p=prog(lt,st.t,st.t+0.35);if(p<=0)return '';const e=eb(p);
  return `<div style="position:absolute;left:540px;top:${st.y||760}px;transform:translate(-50%,-50%) rotate(-12deg) scale(${2.2-1.2*e});opacity:${clamp(p*3)};border:14px solid ${st.color||'#ff2d2d'};border-radius:24px;padding:10px 46px;color:${st.color||'#ff2d2d'};font-weight:800;font-size:${st.size||130}px;letter-spacing:8px;background:rgba(0,0,0,.25)">${st.text}</div>`}

/* ---------- captions ---------- */
const CH=[];(function(){let cur=[];EP.words.forEach((w,i)=>{cur.push(w);const end=/[.,?!:]$/.test(w[0]);const nxt=EP.words[i+1];const gap=nxt?nxt[1]-w[2]:1;if(end||cur.length>=3||gap>0.35){CH.push(cur);cur=[]}});if(cur.length)CH.push(cur)})();
function isEmph(w){return /[!?]$/.test(w)||/\d/.test(w)||/\.\.\.$/.test(w)}
function captionsPill(t){
  let ci=-1;for(let i=0;i<CH.length;i++){const c=CH[i];const s=c[0][1]-0.05;const nx=CH[i+1]?CH[i+1][0][1]-0.05:EP.dur+1;const e=Math.min(nx,c[c.length-1][2]+0.45);if(t>=s&&t<e){ci=i;break}}
  if(ci<0)return '';const c=CH[ci];
  let curI=-1;c.forEach((w,k)=>{if(t>=w[1]-0.03)curI=k});
  const ml=Math.max(...c.map(w=>w[0].length));const fs=ml>18?50:ml>13?66:84;
  const sp=c.map((w,k)=>{const txt=w[0].replace(/[.,!:]+$/,'').replace(/\.\.\.$/,'');
    const a=prog(t,w[1]-0.06,w[1]+0.16);const e=eb(a);
    if(a<=0)return `<span style="display:inline-block;margin:0 6px;opacity:0">${txt}</span>`;
    const cur=k===curI&&t<w[2]+0.25;const em=isEmph(w[0]);
    const sc=(0.55+0.45*e)*(cur?(em?1.18:1.1):1);
    const rot=cur?(k%2?2:-2):0;
    const bg=cur?`background:${em?EC:Y};color:${em?'#141414':'#141414'};text-shadow:none;border-radius:14px;padding:0 14px;box-shadow:0 8px 0 rgba(0,0,0,.55)`:`color:#fff`;
    return `<span style="display:inline-block;margin:0 6px;${bg};transform:translateY(${(1-e)*40}px) scale(${sc}) rotate(${rot}deg);opacity:${clamp(a*3)}">${txt}</span>`}).join(' ');
  return `<div class="stroke" style="position:absolute;left:0;top:${EP.capY||1300}px;width:1080px;padding:0 40px;text-align:center;font-size:${fs}px;font-weight:800;line-height:1.25;text-transform:uppercase">${sp}</div>`}

function capChunk(t){let ci=-1;for(let i=0;i<CH.length;i++){const c=CH[i];const s=c[0][1]-0.05;const nx=CH[i+1]?CH[i+1][0][1]-0.05:EP.dur+1;const e=Math.min(nx,c[c.length-1][2]+0.45);if(t>=s&&t<e){ci=i;break}}return ci<0?null:CH[ci]}
function captionsGlow(t){const c=capChunk(t);if(!c)return '';let curI=-1;c.forEach((w,k)=>{if(t>=w[1]-0.03)curI=k});
  const ml=Math.max(...c.map(w=>w[0].length));const fs=ml>18?54:ml>13?70:90;
  const sp=c.map((w,k)=>{const txt=w[0].replace(/[.,!:]+$/,'').replace(/\.\.\.$/,'');const a=prog(t,w[1]-0.06,w[1]+0.18);if(a<=0)return `<span style="display:inline-block;margin:0 8px;opacity:0">${txt}</span>`;
    const e=eb(a);const cur=k===curI&&t<w[2]+0.25;const em=isEmph(w[0]);const col=cur?(em?EC:Y):'#fff';
    return `<span style="display:inline-block;margin:0 8px;color:${col};transform:scale(${(0.3+0.7*e)*(cur?1.22:1)}) translateY(${cur?-8:0}px);opacity:${clamp(a*3)};text-shadow:0 0 2px #000,4px 4px 0 #000,-4px 4px 0 #000,4px -4px 0 #000,-4px -4px 0 #000,0 0 ${cur?34:0}px ${col}">${txt}</span>`}).join(' ');
  return `<div style="position:absolute;left:0;top:${EP.capY||1300}px;width:1080px;padding:0 40px;text-align:center;font-size:${fs}px;font-weight:800;line-height:1.25;text-transform:uppercase">${sp}</div>`}
function captionsSolo(t){let w=null,k=0;for(let i=0;i<EP.words.length;i++){const x=EP.words[i];const nx=EP.words[i+1];const end=nx?Math.min(nx[1]-0.02,x[2]+0.5):x[2]+0.6;if(t>=x[1]-0.04&&t<end){w=x;k=i;break}}
  if(!w)return '';const txt=w[0].replace(/[.,!:]+$/,'').replace(/\.\.\.$/,'');const a=prog(t,w[1]-0.04,w[1]+0.14);const e=eb(a);const em=isEmph(w[0]);
  const fs=txt.length>14?78:txt.length>9?100:124;const rot=(k%3-1)*3;
  return `<div style="position:absolute;left:0;top:${(EP.capY||1300)-20}px;width:1080px;text-align:center"><span class="stroke" style="display:inline-block;font-size:${fs}px;font-weight:800;text-transform:uppercase;color:${em?EC:(k%2?Y:'#fff')};transform:scale(${0.5+0.5*e}) rotate(${rot}deg);opacity:${clamp(a*3)}">${txt}</span></div>`}
function captions(t){const m=ST.cap||'pill';return m==='glow'?captionsGlow(t):m==='solo'?captionsSolo(t):m==='box'?captionsBox(t):captionsPill(t)}

/* ---------- faces ---------- */
const FACE_EL={};const FN=[...new Set((EP.faces||[]).map(f=>f[1]))];
window.facesReady=Promise.all(FN.map(n=>new Promise(res=>{const im=new Image();im.src=ASSET+'faces/'+n+'.png';im.style.cssText='position:absolute;display:none;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))';im.onload=()=>im.decode().then(res,res);im.onerror=res;document.getElementById('faces').appendChild(im);FACE_EL[n]=im;})));
function renderFaces(t){Object.values(FACE_EL).forEach(e=>e.style.display='none');
  const f=(EP.faces||[]).find(f=>t>=f[0]&&t<f[0]+(f[2]||2.2));if(!f)return;const im=FACE_EL[f[1]];if(!im)return;
  const pin=eb(prog(t,f[0],f[0]+0.35)),pout=eo(prog(t,f[0]+(f[2]||2.2)-0.25,f[0]+(f[2]||2.2)));const s=230;
  im.style.display='block';im.style.width=s+'px';im.style.height=s+'px';im.style.left=(40)+'px';
  im.style.top=(1440+(1-pin)*120+pout*160+Math.sin(t*3)*5)+'px';im.style.transform=`rotate(${Math.sin(t*2.3)*4}deg) scale(${0.5+0.5*pin})`;im.style.opacity=1-pout}

/* ---------- HUD / SFX / checklist / callout (ref: gaya "bedah" kitabedah.id) ---------- */
function atKeys(keys,t){let v=null;for(const k of keys){if(t>=k[0])v=k;else break}return v}
function hudHTML(t){const h=EP.hud;if(!h)return '';const a=eo(prog(t,0,0.4));
  const tt=atKeys(h.title||[],t);const title=tt?tt[1]:'';const tchg=tt?eb(prog(t,tt[0],tt[0]+0.35)):1;
  let val='';if(h.counter){const ks=h.counter.keys;let v=ks[0][1];for(let i=0;i<ks.length-1;i++){if(t>=ks[i][0]){const k=prog(t,ks[i][0],ks[i+1][0]);v=t<ks[i+1][0]?lerp(ks[i][1],ks[i+1][1],io(k)):ks[i+1][1]}}
    const d=h.counter.dec||0;val=v.toFixed(d).replace('.',',');}
  const lo=h.counter?h.counter.keys.reduce((m,k)=>Math.min(m,k[1]),1e9):0,hi=h.counter?h.counter.keys.reduce((m,k)=>Math.max(m,k[1]),-1e9):1;
  const pv=h.counter?clamp((parseFloat(val.replace(',','.'))-lo)/Math.max(1e-6,hi-lo)):0;
  const bd=atKeys(h.badges||[],t);const bpop=bd?eb(prog(t,bd[0],bd[0]+0.3)):0;
  const sub=atKeys(h.sub||[],t);
  return `<div style="position:absolute;left:44px;right:44px;top:205px;opacity:${a};transform:translateY(${(1-a)*-30}px)">
   <div class="stroke" style="font-size:62px;font-weight:800;color:#fff;line-height:1.1;transform:translateX(${(1-tchg)*-40}px);opacity:${clamp(tchg*2)}">${hl(title,EC)}</div>
   ${(h.counter||bd)?`<div style="display:flex;align-items:center;gap:22px;margin-top:14px">
     ${h.counter?`<div class="stroke" style="font-variant-numeric:tabular-nums;font-size:88px;font-weight:800;color:${Y};min-width:${h.counter.w||260}px;line-height:1">${val}<span style="font-size:38px;margin-left:10px;color:#fff">${h.counter.unit||''}</span></div>
     <div style="flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.5)"><div style="height:100%;width:${pv*100}%;background:${Y}"></div></div>`:''}
     ${bd?`<div style="padding:8px 18px;border-radius:12px;background:${bd[2]||EC};color:#111;font-weight:800;font-size:32px;letter-spacing:2px;transform:scale(${0.6+0.4*bpop});box-shadow:0 5px 0 rgba(0,0,0,.5)">${bd[1]}</div>`:''}
   </div>`:''}
   ${sub?`<div class="stroke" style="font-size:34px;font-weight:700;color:#fff;margin-top:6px;opacity:.9">${sub[1]}</div>`:''}
  </div>`}
function sfxHTML(t){return (EP.sfx||[]).map(x=>{const [t0,text,xx,yy,rot,col]=x;const d=x[6]||1.3;if(t<t0||t>t0+d)return '';
  const a=prog(t,t0,t0+0.18),o=1-prog(t,t0+d-0.25,t0+d);const sh=(1-prog(t,t0,t0+0.4))*12;
  return `<div style="position:absolute;left:${xx??540}px;top:${yy??700}px;transform:translate(-50%,-50%) rotate(${rot??-10}deg) scale(${(0.2+0.8*eb(a))*(1+0.04*Math.sin(t*20))}) translate(${Math.sin(t*60)*sh}px,${Math.cos(t*55)*sh}px);opacity:${o};font-weight:900;font-size:${x[7]||120}px;letter-spacing:2px;font-style:italic;color:${col||Y};-webkit-text-stroke:6px #111;paint-order:stroke fill;text-shadow:8px 8px 0 #111;white-space:nowrap">${text}</div>`}).join('')}
function checkHTML(t){const c=EP.check;if(!c||t<c.t||(c.t1&&t>c.t1))return '';const a=eb(prog(t,c.t,c.t+0.35));
  const items=c.items.map(it=>{const on=t>=it[0];const p=eb(prog(t,it[0],it[0]+0.3));return `<div style="display:flex;align-items:center;gap:16px;margin:10px 0;font-size:40px;font-weight:700;color:${on?'#fff':'rgba(255,255,255,.4)'}"><div style="width:44px;height:44px;border-radius:10px;background:${on?'#3ddc84':'rgba(255,255,255,.15)'};display:flex;align-items:center;justify-content:center;color:#111;font-size:32px;transform:scale(${on?0.7+0.3*p:1})">${on?'✓':''}</div>${it[1]}</div>`}).join('');
  return `<div style="position:absolute;left:${c.x||60}px;top:${c.y||520}px;padding:26px 34px;border-radius:24px;background:rgba(10,10,14,.86);box-shadow:0 12px 0 rgba(0,0,0,.35);transform:scale(${0.8+0.2*a});transform-origin:0 0;opacity:${a}"><div style="font-size:28px;font-weight:800;letter-spacing:3px;color:${Y};margin-bottom:8px">${c.title||'CEK'}</div>${items}</div>`}
function calloutHTML(o,x,y,p){const left=(o.side||'r')==='l';return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${left?'-100%':'0'},-50%) scale(${0.5+0.5*eb(p)});transform-origin:${left?'100%':'0'} 50%;opacity:${clamp(p*2)};padding:10px 22px;border-radius:30px;background:#141418;color:#fff;font-weight:800;font-size:${o.size||36}px;letter-spacing:1px;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.4)">${left?'':'← '}${hl(o.text)}${left?' →':''}</div>`}
function captionsBox(t){const c=capChunk(t);if(!c)return '';let curI=-1;c.forEach((w,k)=>{if(t>=w[1]-0.03)curI=k});
  const pop=eb(prog(t,c[0][1]-0.06,c[0][1]+0.12));
  const sp=c.map((w,k)=>{const txt=w[0].replace(/[.,!:]+$/,'').replace(/\.\.\.$/,'');const cur=k===curI&&t<w[2]+0.25;const said=t>=w[1]-0.03;
    return `<span style="display:inline-block;margin:0 5px;padding:0 10px;border-radius:10px;${cur?`background:${isEmph(w[0])?EC:Y};color:#111`:`color:${said?'#fff':'rgba(255,255,255,.45)'}`}">${txt}</span>`}).join('');
  const ml=Math.max(...c.map(w=>w[0].length));const fs=ml>14?52:62;
  return `<div style="position:absolute;left:0;top:${(EP.capY||1300)+10}px;width:1080px;text-align:center"><div style="display:inline-block;max-width:960px;padding:14px 22px;border-radius:22px;background:rgba(16,16,20,.88);font-size:${fs}px;font-weight:800;line-height:1.3;transform:scale(${0.85+0.15*pop});box-shadow:0 8px 0 rgba(0,0,0,.35)">${sp}</div></div>`}

/* ---------- main ---------- */
const PART=[...Array(22)].map((_,i)=>{const r=x=>{const v=Math.sin(i*127.1+x*311.7)*43758.5453;return v-Math.floor(v)};return {x:r(1)*1080,y:r(2)*1920,s:2+r(3)*5,v:20+r(4)*45,ph:r(5)*6.28}});
function particles(t){return PART.map(p=>{const y=((p.y-t*p.v)%1920+1920)%1920;const x=p.x+Math.sin(t*0.8+p.ph)*30;return `<div style="position:absolute;left:${x}px;top:${y}px;width:${p.s}px;height:${p.s}px;border-radius:50%;background:#fff;opacity:${0.12+0.12*Math.sin(t*2+p.ph)}"></div>`}).join('')}
function emphPunch(t){let k=0;for(const w of EP.words){if(w[1]>t)break;if(/[!?]$/.test(w[0])||/\.\.\.$/.test(w[0])){const d=t-w[2];if(d>=0&&d<0.5)k=Math.max(k,1-d/0.5)}}return k}
function render(t){
  let i=EP.scenes.findIndex(s=>t<s.t1);if(i<0)i=EP.scenes.length-1;const s=EP.scenes[i];const lt=t-s.t0;
  if(s.type!=='map')document.getElementById('maplayer').style.display='none';
  let body=s.type==='map'?mapScene(s,lt,i):s.type==='photo'?photoScene(s,lt):cardScene(s,lt);
  if(s.head)body+=headHTML(s.head,lt);
  if(s.stamp)body+=stampHTML(s.stamp,lt);
  // transition-in (varies per scene)
  const tp=i>0?prog(lt,0,0.32):1;const te=eo(tp);const TS={campur:[0,1,2,3],zoom:[0,3,0,3],geser:[1,2,1,2],putar:[3,0,3,1]}[ST.trans||'campur']||[0,1,2,3];const kind=TS[i%4];
  let tx=0,ty=0,ts=1,tr=0,tb=0;
  if(tp<1){const k=1-te;ts=1+0.32*k;tb=k*14;if(kind===1){tx=k*130}else if(kind===2){ty=k*-230}else if(kind===3){tr=k*-4}}
  // handheld drift + emphasis punch
  const dx=Math.sin(t*0.9)*6+Math.sin(t*2.3)*2,dy=Math.cos(t*0.7)*6,dr=Math.sin(t*0.5)*0.4;
  const pk=emphPunch(t);const punch=(1+0.05*eb(1-pk))*(pk>0?1:1);const ps=1+0.045*pk;
  const T=`translate(${tx+dx}px,${ty+dy}px) scale(${ts*ps}) rotate(${tr+dr}deg)`;
  const ml=document.getElementById('maplayer');ml.style.transform=T;ml.style.filter=tb>0.3?`blur(${tb}px)`:'none';
  const flash=i>0?(1-prog(lt,0,0.1))*0.28:0;
  const wm=`<div style="position:absolute;left:44px;top:150px;color:rgba(255,255,255,.75);font-weight:700;font-size:32px;text-shadow:0 2px 6px rgba(0,0,0,.6)">@intinyaaje</div>`;
  const vig=`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)"></div>`;
  document.getElementById('root').innerHTML=`<div style="position:absolute;inset:-40px;transform:${T};${tb>0.3?`filter:blur(${tb}px);`:''}"><div style="position:absolute;left:40px;top:40px;width:1080px;height:1920px">${body}</div></div>${vig}<div style="position:absolute;inset:0">${particles(t)}</div><div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`+wm+hudHTML(t)+checkHTML(t)+sfxHTML(t)+captions(t);
  renderFaces(t);
}
window.render=render;
</script></body></html>
